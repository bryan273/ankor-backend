<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 360' width='880' height='360' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='880' height='360' fill='white'/><text x='20' y='30' font-size='15' fill='#0f172a' font-weight='700' text-anchor='start'>What crosses the gap between messages</text><text x='20' y='48' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>every serious defect found in testing lived in this gap</text><rect x='20' y='64' width='170' height='34' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='105' y='86' font-size='12' fill='#2563eb' font-weight='700' text-anchor='middle'>turn 1</text><rect x='690' y='64' width='170' height='34' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='775' y='86' font-size='12' fill='#2563eb' font-weight='700' text-anchor='middle'>turn 2</text><line x1='190' y1='81' x2='688' y2='81' stroke='#2563eb' stroke-width='1.4' stroke-dasharray='6 5'/><path d='M 683 77 L 688 81 L 683 85' fill='none' stroke='#2563eb' stroke-width='1.4'/><text x='440' y='74' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>sessions.meta (Postgres)</text><rect x='20' y='114' width='840' height='36' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='137' font-size='11.5' fill='#2563eb' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>resolved_sku</text><text x='250' y='137' font-size='11.5' fill='#0f172a' font-weight='400' text-anchor='start'>the device they settled on</text><text x='860' y='137' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>never re-ask the picker</text><rect x='20' y='160' width='840' height='36' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='183' font-size='11.5' fill='#2563eb' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>purchase</text><text x='250' y='183' font-size='11.5' fill='#0f172a' font-weight='400' text-anchor='start'>the purchase the records established</text><text x='860' y='183' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>same verdict twice</text><rect x='20' y='206' width='840' height='36' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='229' font-size='11.5' fill='#2563eb' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>failed_attempts</text><text x='250' y='229' font-size='11.5' fill='#0f172a' font-weight='400' text-anchor='start'>fixes that did not work</text><text x='860' y='229' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>escalate on time</text><rect x='20' y='252' width='840' height='36' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='275' font-size='11.5' fill='#2563eb' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>ticket</text><text x='250' y='275' font-size='11.5' fill='#0f172a' font-weight='400' text-anchor='start'>the open ticket and its ETA</text><text x='860' y='275' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>one ticket per conversation</text><rect x='20' y='298' width='840' height='36' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='321' font-size='11.5' fill='#2563eb' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>safety</text><text x='250' y='321' font-size='11.5' fill='#0f172a' font-weight='400' text-anchor='start'>a safety case, once raised</text><text x='860' y='321' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>stays a safety case</text></svg>