<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 420' width='880' height='420' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='880' height='420' fill='white'/><text x='20' y='30' font-size='15' fill='#0f172a' font-weight='700' text-anchor='start'>Warranty is decided by the engine, not the model</text><text x='20' y='48' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>the model picks which record to read; the record supplies the facts</text><rect x='20' y='70' width='200' height='76' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='36' y='94' font-size='12' fill='#0f172a' font-weight='700' text-anchor='start'>Facts, in order</text><text x='36' y='112' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='start'>1  this turn's lookup</text><text x='36' y='126' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='start'>2  the purchase so far</text><text x='36' y='140' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='start'>3  their own order</text><line x1='220' y1='108' x2='268' y2='108' stroke='#2563eb' stroke-width='1.4'/><path d='M 263 104 L 268 108 L 263 112' fill='none' stroke='#2563eb' stroke-width='1.4'/><rect x='270' y='70' width='190' height='76' rx='10' fill='white' stroke='#2563eb' stroke-width='1.2'/><text x='365' y='98' font-size='13' fill='#2563eb' font-weight='700' text-anchor='middle'>Rule engine</text><text x='365' y='118' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>safety, damage, channel,</text><text x='365' y='132' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>dealer, term, evidence</text><circle cx='300' cy='180' r='4.5' fill='#059669'/><text x='316' y='184' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>covered</text><text x='560' y='184' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>in term, on file</text><circle cx='300' cy='214' r='4.5' fill='#059669'/><text x='316' y='218' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>covered_via_dealer</text><text x='560' y='218' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>dealer invoice verified</text><circle cx='300' cy='248' r='4.5' fill='#059669'/><text x='316' y='252' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>covered_pending_verification</text><text x='560' y='252' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>receipt supplied</text><circle cx='300' cy='282' r='4.5' fill='#d97706'/><text x='316' y='286' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>needs_proof</text><text x='560' y='286' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>marketplace, no receipt</text><circle cx='300' cy='316' r='4.5' fill='#64748b'/><text x='316' y='320' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>expired</text><text x='560' y='320' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>out of term</text><circle cx='300' cy='350' r='4.5' fill='#e11d48'/><text x='316' y='354' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>not_covered_policy</text><text x='560' y='354' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>damage, wear, grey market</text><circle cx='300' cy='384' r='4.5' fill='#2563eb'/><text x='316' y='388' font-size='11.5' fill='#0f172a' font-weight='600' text-anchor='start' font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>escalate_human</text><text x='560' y='388' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>nothing identifies it</text><line x1='365' y1='150' x2='365' y2='166' stroke='#cbd5e1' stroke-width='1.4'/><path d='M 361 161 L 365 166 L 369 161' fill='none' stroke='#cbd5e1' stroke-width='1.4'/><text x='20' y='396' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>The reply may phrase the verdict and nothing else: no softening, no promise it did not grant.</text></svg>