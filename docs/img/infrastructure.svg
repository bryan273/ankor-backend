<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 470' width='880' height='470' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='880' height='470' fill='white'/><text x='20' y='30' font-size='15' fill='#0f172a' font-weight='700' text-anchor='start'>Infrastructure</text><text x='20' y='48' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>what runs where, and what it costs a turn</text><rect x='20' y='70' width='180' height='56' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='110' y='94' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='middle'>Browser</text><text x='110' y='111' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>shop / console</text><line x1='200' y1='98' x2='246' y2='98' stroke='#2563eb' stroke-width='1.4'/><path d='M 241 94 L 246 98 L 241 102' fill='none' stroke='#2563eb' stroke-width='1.4'/><rect x='248' y='70' width='200' height='56' rx='10' fill='white' stroke='#2563eb' stroke-width='1.2'/><text x='348' y='94' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='middle'>Next.js (Vercel)</text><text x='348' y='111' font-size='10' fill='#64748b' font-weight='400' text-anchor='middle'>route handlers hold the key</text><line x1='448' y1='98' x2='494' y2='98' stroke='#2563eb' stroke-width='1.4'/><path d='M 489 94 L 494 98 L 489 102' fill='none' stroke='#2563eb' stroke-width='1.4'/><rect x='496' y='70' width='210' height='56' rx='10' fill='white' stroke='#2563eb' stroke-width='1.2'/><text x='601' y='94' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='middle'>FastAPI agent</text><text x='601' y='111' font-size='10' fill='#64748b' font-weight='400' text-anchor='middle'>SSE, one turn per request</text><text x='20' y='176' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='start'>What the agent calls</text><rect x='20' y='192' width='840' height='34' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='214' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>DeepSeek</text><text x='230' y='214' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>deepseek-chat + deepseek-flash (vision)</text><text x='860' y='214' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>6 to 8 calls per turn</text><line x1='601' y1='126' x2='601' y2='190' stroke='#cbd5e1' stroke-width='1.4' stroke-dasharray='4 4'/><path d='M 597 185 L 601 190 L 605 185' fill='none' stroke='#cbd5e1' stroke-width='1.4'/><rect x='20' y='234' width='840' height='34' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='256' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>Gemini embeddings</text><text x='230' y='256' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>gemini-embedding-001, 3,072 dimensions</text><text x='860' y='256' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>1 call per search</text><rect x='20' y='276' width='840' height='34' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='298' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>Pinecone</text><text x='230' y='298' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>10,499 vectors, 4 namespaces</text><text x='860' y='298' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>manuals, tickets, products, community</text><rect x='20' y='318' width='840' height='34' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='340' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>Postgres (Supabase)</text><text x='230' y='340' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>25 tables, session pooler</text><text x='860' y='340' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>catalogue, orders, sessions, traces</text><rect x='20' y='360' width='840' height='34' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='382' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>Supabase Storage</text><text x='230' y='382' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>customer photographs</text><text x='860' y='382' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>served back through the API</text><rect x='20' y='410' width='410' height='44' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='429' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>Cost per turn</text><text x='40' y='445' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='start'>about 0.0014 credits, roughly 10 s median</text><rect x='450' y='410' width='410' height='44' rx='10' fill='#f8fafc' stroke='#cbd5e1' stroke-width='1.2'/><text x='470' y='429' font-size='11.5' fill='#0f172a' font-weight='700' text-anchor='start'>Secrets</text><text x='470' y='445' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='start'>server side only, never in the browser bundle</text></svg>