<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 370' width='880' height='370' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='880' height='370' fill='white'/><text x='20' y='32' font-size='15' fill='#0f172a' font-weight='700' text-anchor='start'>“My S1 Pro isn't sucking”: which S1 Pro?</text><text x='20' y='50' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>a breast pump and a robot vacuum share the name, so the cheap signals go first</text><rect x='20' y='74' width='700' height='42' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='100' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='start'>1  Alias table</text><text x='230' y='100' font-size='11.5' fill='#64748b' font-weight='400' text-anchor='start'>“S1 Pro”, “omni s1”, “my robovac”</text><text x='860' y='100' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>free</text><line x1='370' y1='116' x2='370' y2='128' stroke='#cbd5e1' stroke-width='1.4'/><path d='M 366 123 L 370 128 L 374 123' fill='none' stroke='#cbd5e1' stroke-width='1.4'/><rect x='20' y='128' width='700' height='42' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='154' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='start'>2  Their own purchases</text><text x='230' y='154' font-size='11.5' fill='#64748b' font-weight='400' text-anchor='start'>one match on this account decides it</text><text x='860' y='154' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>one query</text><line x1='370' y1='170' x2='370' y2='182' stroke='#cbd5e1' stroke-width='1.4'/><path d='M 366 177 L 370 182 L 374 177' fill='none' stroke='#cbd5e1' stroke-width='1.4'/><rect x='20' y='182' width='700' height='42' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='208' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='start'>3  Their words</text><text x='230' y='208' font-size='11.5' fill='#64748b' font-weight='400' text-anchor='start'>“mopping” rules out the breast pump</text><text x='860' y='208' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>free</text><line x1='370' y1='224' x2='370' y2='236' stroke='#cbd5e1' stroke-width='1.4'/><path d='M 366 231 L 370 236 L 374 231' fill='none' stroke='#cbd5e1' stroke-width='1.4'/><rect x='20' y='236' width='700' height='42' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='40' y='262' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='start'>4  The photo</text><text x='230' y='262' font-size='11.5' fill='#64748b' font-weight='400' text-anchor='start'>kind of device, brand, model sticker</text><text x='860' y='262' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>already read</text><line x1='370' y1='278' x2='370' y2='290' stroke='#cbd5e1' stroke-width='1.4'/><path d='M 366 285 L 370 290 L 374 285' fill='none' stroke='#cbd5e1' stroke-width='1.4'/><rect x='20' y='290' width='700' height='42' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='40' y='316' font-size='12.5' fill='#0f172a' font-weight='700' text-anchor='start'>5  Ask, once</text><text x='230' y='316' font-size='11.5' fill='#64748b' font-weight='400' text-anchor='start'>a picker with pictures, then remembered</text><text x='860' y='316' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='end'>costs a turn</text></svg>