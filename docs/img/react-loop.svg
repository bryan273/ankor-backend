<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 300' width='880' height='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='880' height='300' fill='white'/><text x='20' y='30' font-size='15' fill='#0f172a' font-weight='700' text-anchor='start'>Inside step four: think, act, observe</text><text x='20' y='48' font-size='11' fill='#64748b' font-weight='400' text-anchor='start'>the loop stops the moment it can answer, and never repeats a call</text><rect x='60' y='106' width='180' height='88' rx='14' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='150' y='136' font-size='13.5' fill='#0f172a' font-weight='700' text-anchor='middle'>Think</text><text x='150' y='156' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>one sentence,</text><text x='150' y='170' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>written for the customer</text><rect x='310' y='106' width='180' height='88' rx='14' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='400' y='136' font-size='13.5' fill='#0f172a' font-weight='700' text-anchor='middle'>Act</text><text x='400' y='156' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>one tool,</text><text x='400' y='170' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>cheapest first</text><rect x='560' y='106' width='180' height='88' rx='14' fill='white' stroke='#cbd5e1' stroke-width='1.2'/><text x='650' y='136' font-size='13.5' fill='#0f172a' font-weight='700' text-anchor='middle'>Observe</text><text x='650' y='156' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>read the record,</text><text x='650' y='170' font-size='10.5' fill='#64748b' font-weight='400' text-anchor='middle'>enough to answer?</text><line x1='242' y1='150' x2='308' y2='150' stroke='#2563eb' stroke-width='1.4'/><path d='M 303 146 L 308 150 L 303 154' fill='none' stroke='#2563eb' stroke-width='1.4'/><line x1='492' y1='150' x2='558' y2='150' stroke='#2563eb' stroke-width='1.4'/><path d='M 553 146 L 558 150 L 553 154' fill='none' stroke='#2563eb' stroke-width='1.4'/><path d='M 650 196 C 650 250, 150 250, 150 196' fill='none' stroke='#2563eb' stroke-width='1.4' stroke-dasharray='5 4'/><text x='400' y='244' font-size='10.5' fill='#2563eb' font-weight='400' text-anchor='middle'>not yet: another pass</text><line x1='740' y1='150' x2='800' y2='150' stroke='#059669' stroke-width='1.4'/><path d='M 795 146 L 800 150 L 795 154' fill='none' stroke='#059669' stroke-width='1.4'/><text x='810' y='146' font-size='11' fill='#059669' font-weight='600' text-anchor='start'>answer</text><text x='810' y='162' font-size='10' fill='#64748b' font-weight='400' text-anchor='start'>compose</text></svg>